# COPY of official cfg/paper/specpc/longbench/qwen25_05b_14b/cmax_2048/hotpotqa.yaml (d70fabb)
# CHANGED: target 14B -> Qwen2.5-7B-Instruct (disk: 23-29GB free < 14B 29.55GB). Not the paper setting.
draft_model:
  model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  attn_implementation: flash_attention_2
target_model:
  model_name_or_path: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  attn_implementation: flash_attention_2
dataset:
  dataset_name: longbench
  task: hotpotqa
sparse_config:
  sparse_type: specpc
  max_capacity_prompt: 2048
  window_size: 64
  pool_type: max
  kernel_size: 64
  neighbor_tokens: 64
  reduction_type: max
  lookahead_tokens: 1
  starting_layer_index: 8
  weighted_query: true
